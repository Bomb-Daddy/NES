name: GK1 current inherited native Win32 and NSIS acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gk1-native-windows.yml'
      - 'research/Genghis_Khan_NES/execution_257_current_win32_gate/**'
      - 'research/Genghis_Khan_NES/execution_259_win32_posix_test_port/**'
      - 'research/Genghis_Khan_NES/execution_260_win32_patch_scope/**'
      - 'research/Genghis_Khan_NES/execution_261_win32_ctest_registry/**'
      - 'research/Genghis_Khan_NES/execution_262_exe_csv_stage/**'

permissions:
  contents: read

jobs:
  native-win32-current:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand SHA-pinned complete current-game build source
        shell: pwsh
        run: |
          $archive = 'research/Genghis_Khan_NES/execution_257_current_win32_gate/GK1_EXEC0256_Lean_Inherited_Build_Source.zip'
          $expected = '97421aa2ef45288684bf22d868ad110b850396c316bce9253b0fc8a05166b619'
          if (-not (Test-Path -LiteralPath $archive)) { throw 'Pinned complete inherited C11 build source missing; never substitute EXEC0228' }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inherited native source SHA mismatch $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath current-gk1 -Force
          # EXEC0260: immutable authored source is already present in this
          # verified checkout. Copy exact 0257 WinMain test and current 0260
          # hostile gate rather than silently skipping a nonmatching old patch.
          $origin257 = 'research/Genghis_Khan_NES/execution_257_current_win32_gate'
          $origin260 = 'research/Genghis_Khan_NES/execution_260_win32_patch_scope'
          $dest = 'current-gk1/execution_199/packaging'
          Copy-Item "$origin257/test_gk257_win32_acceptance.ps1" "$dest/test_gk257_win32_acceptance.ps1" -Force
          Copy-Item "$origin260/test_gk260_windows_ci_gate.py" "$dest/test_gk257_windows_ci_gate.py" -Force
          foreach ($pair in @(
            @("$origin257/test_gk257_win32_acceptance.ps1", "$dest/test_gk257_win32_acceptance.ps1"),
            @("$origin260/test_gk260_windows_ci_gate.py", "$dest/test_gk257_windows_ci_gate.py")
          )) {
            if (-not (Test-Path -LiteralPath $pair[1])) { throw "Source script copy missing: $($pair[1])" }
            if ((Get-FileHash $pair[0] -Algorithm SHA256).Hash -ne (Get-FileHash $pair[1] -Algorithm SHA256).Hash) {
              throw "Source script copy mismatch: $($pair[1])"
            }
          }
          # The inspected workflow must be the same live workflow being executed.
          Copy-Item '.github/workflows/gk1-native-windows.yml' 'current-gk1/.github/workflows/gk1-native-windows.yml' -Force
          # Restore the original EXEC0257 CMake test registration explicitly.
          $cmake = 'current-gk1/execution_199/CMakeLists.txt'
          $gk257 = @(
            '# EXEC0257: executable workflow anti-stale hostile QA (EXEC0260 source-scoped restoration).',
            'find_package(Python3 COMPONENTS Interpreter QUIET)',
            'if(Python3_Interpreter_FOUND)',
            ' add_test(NAME GK1_257_CurrentWin32Workflow_RejectsStaleSourceAndFalsePass',
            '  COMMAND ${Python3_EXECUTABLE}',
            '   ${CMAKE_CURRENT_SOURCE_DIR}/packaging/test_gk257_windows_ci_gate.py',
            '   ${CMAKE_CURRENT_SOURCE_DIR}/../.github/workflows/gk1-native-windows.yml',
            '   ${CMAKE_CURRENT_SOURCE_DIR}/packaging/test_gk257_win32_acceptance.ps1)',
            'endif()'
          )
          if (Select-String -LiteralPath $cmake -Pattern 'add_test\(NAME GK1_257_' -Quiet) { throw 'Unexpected duplicate EXEC0257 test registration in pinned source' }
          Add-Content -LiteralPath $cmake -Value $gk257
          # EXEC0259: port real POSIX-only test sources; assert all touched files.
          $patch259 = 'research/Genghis_Khan_NES/execution_259_win32_posix_test_port/GK1_EXEC0259_Integration_From0257.patch'
          # EXEC0260: the historical EXEC0259 patch also fails --check against
          # the exact pinned ZIP; apply source-equivalent transformations with
          # anchored assertions, never a silent no-op or skipped Win32 target.
          $cmake = 'current-gk1/execution_199/CMakeLists.txt'
          $cmakeText = [IO.File]::ReadAllText($cmake).Replace("`r`n", "`n")
          $before = $cmakeText.IndexOf('# EXEC0120 portable user-data policy')
          if ($before -lt 0) { throw 'CMake POSIX test anchor missing' }
          $after = $cmakeText.IndexOf('# EXEC0121 original', $before)
          if ($after -lt 0 -or $cmakeText.Substring($before,$after-$before).IndexOf('add_executable(test_gk120_save_home') -lt 0) { throw 'Unexpected CMake POSIX test content' }
          $gk259 = @(
            '# EXEC0259 Win32 LocalAppData native assertions; POSIX XDG test remains Linux-only.',
            'if(WIN32)',
            ' add_executable(test_gk259_win_user_home test_gk259_win_user_home.c)',
            ' target_link_libraries(test_gk259_win_user_home PRIVATE gk59_storage)',
            ' add_test(NAME GK1_259_Win32LocalAppDataPathAndRefusal COMMAND test_gk259_win_user_home)',
            'else()',
            ' add_executable(test_gk120_save_home test_gk120_save_home.c)',
            ' target_link_libraries(test_gk120_save_home PRIVATE gk120_save_home gk58_slots gk59_storage)',
            ' add_test(NAME GK1_120_NativeLinuxXDGHomeAndWinEnhancedUserDataNoCWD COMMAND test_gk120_save_home)',
            'endif()',
            ''
          ) -join "`n"
          [IO.File]::WriteAllText($cmake, $cmakeText.Substring(0,$before) + $gk259 + $cmakeText.Substring($after))
          $p91 = 'current-gk1/execution_199/test_gk91_reset_zero.c'
          $s91 = [IO.File]::ReadAllText($p91).Replace("`r`n", "`n")
          $inc91 = '#include <unistd.h>'
          $old91 = 'char badname[512];snprintf(badname,sizeof badname,"/tmp/gk91-altered-%ld.nes",(long)getpid());'
          if (-not $s91.Contains($inc91) -or -not $s91.Contains($old91)) { throw 'Unrecognized original reset test; refuse replacement' }
          $newInc91 = @('#ifdef _WIN32','# include <process.h>','# define GK91_PROCESS_ID _getpid','#else','# include <unistd.h>','# define GK91_PROCESS_ID getpid','#endif') -join "`n"
          $new91 = @(
            'char badname[512];',
            '#ifdef _WIN32',
            '  const char *temp=getenv("TEMP"); CHECK(temp&&*temp);',
            '  snprintf(badname,sizeof badname,"%s\\gk91-altered-%ld.nes",temp,(long)GK91_PROCESS_ID());',
            '#else',
            '  snprintf(badname,sizeof badname,"/tmp/gk91-altered-%ld.nes",(long)GK91_PROCESS_ID());',
            '#endif'
          ) -join "`n"
          $s91 = $s91.Replace($inc91,$newInc91).Replace($old91,$new91)
          [IO.File]::WriteAllText($p91,$s91)
          $pPre = 'current-gk1/execution_199/test_gk1_pre_setup_store.c'
          $sPre = [IO.File]::ReadAllText($pPre).Replace("`r`n", "`n")
          if (-not $sPre.Contains('#include <unistd.h>')) { throw 'Unrecognized pre-setup save test; refuse replacement' }
          [IO.File]::WriteAllText($pPre,$sPre.Replace('#include <unistd.h>', ''))
          $src259 = 'research/Genghis_Khan_NES/execution_259_win32_posix_test_port/test_gk259_win_user_home.c'
          $dst259 = 'current-gk1/execution_199/test_gk259_win_user_home.c'
          Copy-Item $src259 $dst259 -Force
          if ((Get-FileHash $src259 -Algorithm SHA256).Hash -ne (Get-FileHash $dst259 -Algorithm SHA256).Hash) { throw 'EXEC0259 copied Windows test SHA mismatch' }
          if (-not (Select-String -LiteralPath 'current-gk1/execution_199/CMakeLists.txt' -Pattern 'GK1_259_Win32LocalAppDataPathAndRefusal' -SimpleMatch -Quiet)) { throw 'EXEC0259 Win32 CTest registration missing' }
          # EXEC0261: preserve Linux-only tests on POSIX but never launch the
          # Linux/X11 command-line shell on the WinMain host or require xvfb-run.
          # Real native Windows WinMain GUI/gamepad and NSIS tests remain required.
          $cmakeNow = [IO.File]::ReadAllText($cmake).Replace("`r`n", "`n")
          $linuxGui = @(
            'GK1_071_NativeControllerVIEWASafeGateAndBothWorldsImmutable',
            'GK1_073_MergedControllerBudgetAndBattlePassPreSetupWorldImmutable',
            'GK1_074_MergedSpringControllerNoWorldMutation',
            'GK1_075_ActualNativeControllerSpringPreviewNoMutation'
          )
          foreach ($testName in $linuxGui) {
            $needle = 'add_test(NAME ' + $testName
            $begin = $cmakeNow.IndexOf($needle)
            if ($begin -lt 0 -or $cmakeNow.IndexOf($needle,$begin+1) -ge 0) { throw "Unexpected GUI test CMake anchor: $testName" }
            $end = $cmakeNow.IndexOf(')', $begin)
            if ($end -lt 0) { throw "Unclosed GUI test: $testName" }
            $original = $cmakeNow.Substring($begin,$end-$begin+1)
            $cmakeNow = $cmakeNow.Replace($original, "if(NOT WIN32)`n" + $original + "`nendif()")
          }
          $p176 = "if(Python3_Interpreter_FOUND)`n add_test(NAME GK1_176_LauncherAndDualPackagingVersionContract"
          $p221 = "if(Python3_Interpreter_FOUND)`n add_test(NAME GK1_221_PrivateStockMesenCaptureRunnerAdversarialHarness"
          foreach ($spec in @($p176,$p221)) {
            if (-not $cmakeNow.Contains($spec)) { throw "Missing platform-specific source test registration: $spec" }
            $cmakeNow = $cmakeNow.Replace($spec,$spec.Replace('if(Python3_Interpreter_FOUND)','if(Python3_Interpreter_FOUND AND NOT WIN32)'))
          }
          $p250 = 'add_test(NAME GK1_250_OriginalThreeOrderFullColdSmoke_FailClosed'
          $s250 = $cmakeNow.IndexOf($p250)
          $e250 = $cmakeNow.IndexOf('set_tests_properties(GK1_250_OriginalThreeOrderFullColdSmoke_FailClosed', $s250)
          if ($s250 -lt 0 -or $e250 -lt 0) { throw 'Missing original Linux-only WinMain-incompatible 250 test' }
          $end250 = $cmakeNow.IndexOf(')', $e250)
          if ($end250 -lt 0) { throw 'Malformed original 250 CMake test' }
          $fragment250 = $cmakeNow.Substring($s250,$end250-$s250+1)
          $cmakeNow = $cmakeNow.Replace($fragment250,"if(NOT WIN32)`n"+$fragment250+"`nendif()")
          [IO.File]::WriteAllText($cmake,$cmakeNow)
          # Source-level guard: the exclusion must be specific, not global.
          if (-not $cmakeNow.Contains('GK1_259_Win32LocalAppDataPathAndRefusal') -or
              -not $cmakeNow.Contains('GK1_257_CurrentWin32Workflow_RejectsStaleSourceAndFalsePass')) {
            throw 'Native Windows acceptance tests must remain registered'
          }
          if (-not (Test-Path current-gk1/execution_199/gk1_native_shell.c)) { throw 'Current complete C11 app missing' }
          if (-not (Test-Path current-gk1/execution_049/GK1_ALL_41_COUNTRY_ECONOMIC_DATA_v1.07.csv)) { throw 'Exact public source CSV missing' }
          # EXEC0262: reviewer-independent, exact anchored source transform
          # after 0261 platform edits. The original pristine-source patch is
          # published separately and was replayed, but its CMake hunk does not
          # apply after the 0261 CMake Win32 host source transformations.
          # Never skip the source stage or imply a successful gamepad smoke.
          $source262 = 'research/Genghis_Khan_NES/execution_262_exe_csv_stage/test_gk262_binary_csv_stage.py'
          $dest262 = 'current-gk1/execution_199/packaging/test_gk262_binary_csv_stage.py'
          if (-not (Test-Path -LiteralPath $source262)) { throw 'EXEC0262 reviewed test is missing' }
          if (Test-Path -LiteralPath $dest262) { throw 'Unexpected duplicate EXEC0262 source test' }
          Copy-Item -LiteralPath $source262 -Destination $dest262
          if ((Get-FileHash -LiteralPath $source262 -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $dest262 -Algorithm SHA256).Hash) {
            throw 'EXEC0262 source test differs from verified GitHub version'
          }
          $s262 = [IO.File]::ReadAllText($cmake).Replace("`r`n", "`n")
          $a262 = @(
            'configure_file(../execution_049/GK1_ALL_41_COUNTRY_ECONOMIC_DATA_v1.07.csv',
            '  ${CMAKE_CURRENT_BINARY_DIR}/GK1_ALL_41_COUNTRY_ECONOMIC_DATA_v1.07.csv COPYONLY)'
          ) -join "`n"
          if (-not $s262.Contains($a262) -or $s262.Contains('GK1_262_NativeExecutableSourceCSVLayoutAndNegativeControls')) {
            throw 'EXEC0262 original-country CMake source anchor missing or duplicate; fail closed'
          }
          $stage262 = @(
            '# EXEC0262: stage authenticated source beside WinMain Release/Debug EXE.',
            'add_custom_command(TARGET gk1_native_shell POST_BUILD',
            ' COMMAND ${CMAKE_COMMAND} -E copy_if_different',
            '  "${CMAKE_CURRENT_SOURCE_DIR}/../execution_049/GK1_ALL_41_COUNTRY_ECONOMIC_DATA_v1.07.csv"',
            '  "$<TARGET_FILE_DIR:gk1_native_shell>/GK1_ALL_41_COUNTRY_ECONOMIC_DATA_v1.07.csv"',
            ' COMMENT "Stage authenticated original-country source beside native executable"',
            ' VERBATIM)',
            'find_package(Python3 COMPONENTS Interpreter QUIET)',
            'if(Python3_Interpreter_FOUND)',
            ' add_test(NAME GK1_262_NativeExecutableSourceCSVLayoutAndNegativeControls',
            '  COMMAND ${Python3_EXECUTABLE}',
            '   ${CMAKE_CURRENT_SOURCE_DIR}/packaging/test_gk262_binary_csv_stage.py',
            '   "$<TARGET_FILE:gk1_native_shell>"',
            '   "${CMAKE_CURRENT_SOURCE_DIR}/../execution_049/GK1_ALL_41_COUNTRY_ECONOMIC_DATA_v1.07.csv"',
            '   "${CMAKE_CURRENT_SOURCE_DIR}/CMakeLists.txt")',
            'endif()'
          ) -join "`n"
          [IO.File]::WriteAllText($cmake, $s262.Replace($a262, $a262+"`n"+$stage262))
          if (-not (Select-String -LiteralPath $cmake -SimpleMatch -Pattern 'GK1_262_NativeExecutableSourceCSVLayoutAndNegativeControls' -Quiet)) {
            throw 'EXEC0262 compiled CMake stage disappeared'
          }
      - name: Install the actual NSIS packager
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          'C:\Program Files (x86)\NSIS' >> $env:GITHUB_PATH
      - name: Install static zlib for authentic archived World-import capability
        shell: pwsh
        run: |
          # Hosted windows-2022 supplies VCPKG_INSTALLATION_ROOT, not necessarily VCPKG_ROOT.
          # Resolve and export the verified installation before the subsequent CMake step.
          $candidates = @($env:VCPKG_ROOT, $env:VCPKG_INSTALLATION_ROOT, 'C:\vcpkg') | Where-Object { $_ } | Select-Object -Unique
          $root = $null
          foreach ($candidate in $candidates) {
            if ((Test-Path -LiteralPath (Join-Path $candidate 'vcpkg.exe')) -and
                (Test-Path -LiteralPath (Join-Path $candidate 'scripts/buildsystems/vcpkg.cmake'))) {
              $root = $candidate
              break
            }
          }
          if (-not $root) { throw 'No verified vcpkg installation (exe plus CMake toolchain) on Windows runner' }
          & (Join-Path $root 'vcpkg.exe') install zlib:x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw 'static zlib install failed' }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
      - name: Compile actual current 1280x720 WinMain C11 XInput game
        shell: pwsh
        run: |
          cmake -S current-gk1/execution_199 -B build-gk1-win32 -G 'Visual Studio 17 2022' -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DGK1_REQUIRE_ARCHIVED_WORLD_IMPORT=ON
          if ($LASTEXITCODE -ne 0) { throw 'Current native Windows CMake configure failed' }
          cmake --build build-gk1-win32 --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Current native Win32 C11 compilation failed' }
          # Actual WinMain resolves this SHA-pinned public CSV beside the
          # executable, not in CWD or the parent build directory.
          $installedSource = 'build-gk1-win32/Release/GK1_ALL_41_COUNTRY_ECONOMIC_DATA_v1.07.csv'
          if (-not (Test-Path -LiteralPath $installedSource)) {
            throw 'EXEC0262 WinMain executable-adjacent scenario CSV is missing'
          }
          $expectedCsvSHA = 'fa3958f156f09d4b4c15bb559c12aa357fc617a9b1f9217505fe07e8800de581'
          $actualCsvSHA = (Get-FileHash -LiteralPath $installedSource -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualCsvSHA -ne $expectedCsvSHA) { throw "EXEC0262 executable CSV SHA mismatch $actualCsvSHA" }
      - name: Execute complete Win32 CTest registry, not an old subset
        shell: pwsh
        run: |
          python research/Genghis_Khan_NES/execution_261_win32_ctest_registry/test_gk261_win32_registry.py build-gk1-win32/CTestTestfile.cmake
          if ($LASTEXITCODE -ne 0) { throw 'EXEC0261 host-specific Windows test registry QA failed' }
          ctest --test-dir build-gk1-win32 -C Release --output-on-failure --timeout 90 -j 4
          if ($LASTEXITCODE -ne 0) { throw 'Current Win32 regression suite failed' }
      - name: Run real WinMain controller simulation, paint and CLI hostile controls
        shell: pwsh
        run: |
          & current-gk1/execution_199/packaging/test_gk257_win32_acceptance.ps1 -Executable (Resolve-Path 'build-gk1-win32/Release/gk1_native_shell.exe').Path
          if ($LASTEXITCODE -ne 0) { throw 'Actual current WinMain acceptance failed' }
      - name: Build and silently install actual current NSIS package
        shell: pwsh
        run: |
          cpack --config build-gk1-win32/CPackConfig.cmake -G NSIS -C Release -B build-gk1-win32/out
          if ($LASTEXITCODE -ne 0) { throw 'NSIS CPack failed' }
          $setup = Get-ChildItem build-gk1-win32/out -Filter '*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'NSIS did not produce setup executable' }
          $target = Join-Path $env:RUNNER_TEMP 'GK1CurrentInstall'
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NSIS installer exit $($p.ExitCode)" }
          $exe = Join-Path $target 'gk1_native_shell.exe'
          $csv = Join-Path $target 'GK1_ALL_41_COUNTRY_ECONOMIC_DATA_v1.07.csv'
          if (-not (Test-Path $exe) -or -not (Test-Path $csv)) { throw 'Native installed EXE or canonical CSV missing' }
          & current-gk1/execution_199/packaging/test_gk257_win32_acceptance.ps1 -Executable $exe
          if ($LASTEXITCODE -ne 0) { throw 'Installed native WinMain acceptance failed' }
          Get-FileHash $exe -Algorithm SHA256
          Write-Output 'TESTED_WIN32_CI native compiled, full CTest, WinMain GUI and NSIS installation; PHYSICAL_XBOX_NOT_RUN; FULL_CAMPAIGNS_NOT_RUN'
      # No copyrighted original NES ROM, private Mesen source, raw RAM, or private original checkpoints.
      # No artifact upload until an accepted distribution release.
