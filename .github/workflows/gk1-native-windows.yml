name: GK1 current inherited native Win32 and NSIS acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gk1-native-windows.yml'
      - 'research/Genghis_Khan_NES/execution_257_current_win32_gate/**'
      - 'research/Genghis_Khan_NES/execution_259_win32_posix_test_port/**'
      - 'research/Genghis_Khan_NES/execution_260_win32_patch_scope/**'

permissions:
  contents: read

jobs:
  native-win32-current:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand SHA-pinned complete current-game build source
        shell: pwsh
        run: |
          $archive = 'research/Genghis_Khan_NES/execution_257_current_win32_gate/GK1_EXEC0256_Lean_Inherited_Build_Source.zip'
          $expected = '97421aa2ef45288684bf22d868ad110b850396c316bce9253b0fc8a05166b619'
          if (-not (Test-Path -LiteralPath $archive)) { throw 'Pinned complete inherited C11 build source missing; never substitute EXEC0228' }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inherited native source SHA mismatch $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath current-gk1 -Force
          $patch = 'research/Genghis_Khan_NES/execution_257_current_win32_gate/GK1_EXEC0257_Integration_From0256.patch'
          # EXEC0260: apply from repository root, with an explicit destination directory.
          # "git -C current-gk1 apply" silently skips outside-prefix paths when
          # current-gk1 is an untracked subdirectory of this checkout (Win32 run 43495268577).
          git apply --check --directory=current-gk1 "$patch"
          if ($LASTEXITCODE -ne 0) { throw 'EXEC0257 patch does not apply to pinned complete source' }
          git apply --directory=current-gk1 "$patch"
          if ($LASTEXITCODE -ne 0) { throw 'EXEC0257 integration patch failed' }
          git apply --reverse --check --directory=current-gk1 "$patch"
          if ($LASTEXITCODE -ne 0) { throw 'EXEC0257 reverse patch verification failed' }
          if (-not (Test-Path 'current-gk1/execution_199/packaging/test_gk257_win32_acceptance.ps1')) {
            throw 'EXEC0257 Win32 acceptance test not materialized in extracted app'
          }
          # EXEC0259: compile nonportable historical test sources under MSVC without
          # sacrificing Linux XDG coverage or silently skipping Win32 path policy.
          $patch259 = 'research/Genghis_Khan_NES/execution_259_win32_posix_test_port/GK1_EXEC0259_Integration_From0257.patch'
          git apply --check --directory=current-gk1 "$patch259"
          if ($LASTEXITCODE -ne 0) { throw 'EXEC0259 Win32 portability patch does not match pinned source' }
          git apply --directory=current-gk1 "$patch259"
          if ($LASTEXITCODE -ne 0) { throw 'EXEC0259 Win32 portability patch failed' }
          git apply --reverse --check --directory=current-gk1 "$patch259"
          if ($LASTEXITCODE -ne 0) { throw 'EXEC0259 reverse patch verification failed' }
          if (-not (Test-Path current-gk1/execution_199/test_gk259_win_user_home.c)) { throw 'Win32 LocalAppData test missing' }
          if (-not (Test-Path current-gk1/execution_199/gk1_native_shell.c)) { throw 'Current complete C11 app missing' }
          if (-not (Test-Path current-gk1/execution_049/GK1_ALL_41_COUNTRY_ECONOMIC_DATA_v1.07.csv)) { throw 'Exact public source CSV missing' }
      - name: Install the actual NSIS packager
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          'C:\Program Files (x86)\NSIS' >> $env:GITHUB_PATH
      - name: Install static zlib for authentic archived World-import capability
        shell: pwsh
        run: |
          # Hosted windows-2022 supplies VCPKG_INSTALLATION_ROOT, not necessarily VCPKG_ROOT.
          # Resolve and export the verified installation before the subsequent CMake step.
          $candidates = @($env:VCPKG_ROOT, $env:VCPKG_INSTALLATION_ROOT, 'C:\vcpkg') | Where-Object { $_ } | Select-Object -Unique
          $root = $null
          foreach ($candidate in $candidates) {
            if ((Test-Path -LiteralPath (Join-Path $candidate 'vcpkg.exe')) -and
                (Test-Path -LiteralPath (Join-Path $candidate 'scripts/buildsystems/vcpkg.cmake'))) {
              $root = $candidate
              break
            }
          }
          if (-not $root) { throw 'No verified vcpkg installation (exe plus CMake toolchain) on Windows runner' }
          & (Join-Path $root 'vcpkg.exe') install zlib:x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw 'static zlib install failed' }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
      - name: Compile actual current 1280x720 WinMain C11 XInput game
        shell: pwsh
        run: |
          cmake -S current-gk1/execution_199 -B build-gk1-win32 -G 'Visual Studio 17 2022' -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DGK1_REQUIRE_ARCHIVED_WORLD_IMPORT=ON
          if ($LASTEXITCODE -ne 0) { throw 'Current native Windows CMake configure failed' }
          cmake --build build-gk1-win32 --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Current native Win32 C11 compilation failed' }
      - name: Execute complete Win32 CTest registry, not an old subset
        shell: pwsh
        run: |
          ctest --test-dir build-gk1-win32 -C Release --output-on-failure --timeout 90 -j 4
          if ($LASTEXITCODE -ne 0) { throw 'Current Win32 regression suite failed' }
      - name: Run real WinMain controller simulation, paint and CLI hostile controls
        shell: pwsh
        run: |
          & current-gk1/execution_199/packaging/test_gk257_win32_acceptance.ps1 -Executable (Resolve-Path 'build-gk1-win32/Release/gk1_native_shell.exe').Path
          if ($LASTEXITCODE -ne 0) { throw 'Actual current WinMain acceptance failed' }
      - name: Build and silently install actual current NSIS package
        shell: pwsh
        run: |
          cpack --config build-gk1-win32/CPackConfig.cmake -G NSIS -C Release -B build-gk1-win32/out
          if ($LASTEXITCODE -ne 0) { throw 'NSIS CPack failed' }
          $setup = Get-ChildItem build-gk1-win32/out -Filter '*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'NSIS did not produce setup executable' }
          $target = Join-Path $env:RUNNER_TEMP 'GK1CurrentInstall'
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NSIS installer exit $($p.ExitCode)" }
          $exe = Join-Path $target 'gk1_native_shell.exe'
          $csv = Join-Path $target 'GK1_ALL_41_COUNTRY_ECONOMIC_DATA_v1.07.csv'
          if (-not (Test-Path $exe) -or -not (Test-Path $csv)) { throw 'Native installed EXE or canonical CSV missing' }
          & current-gk1/execution_199/packaging/test_gk257_win32_acceptance.ps1 -Executable $exe
          if ($LASTEXITCODE -ne 0) { throw 'Installed native WinMain acceptance failed' }
          Get-FileHash $exe -Algorithm SHA256
          Write-Output 'TESTED_WIN32_CI native compiled, full CTest, WinMain GUI and NSIS installation; PHYSICAL_XBOX_NOT_RUN; FULL_CAMPAIGNS_NOT_RUN'
      # No copyrighted original NES ROM, private Mesen source, raw RAM, or private original checkpoints.
      # No artifact upload until an accepted distribution release.
